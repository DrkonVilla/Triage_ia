services:
  - type: web
    name: triage-fastapi
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: triage-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: N8N_WEBHOOK_URL
        value: http://triage-n8n:5678/webhook-test/webhook/critical-alert
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /health

  - type: web
    name: triage-streamlit
    env: docker
    dockerfilePath: ./frontend/streamlit/Dockerfile
    envVars:
      - key: API_BASE_URL
        value: https://triage-fastapi.onrender.com
    healthCheckPath: /_stcore/health

  - type: web
    name: triage-n8n
    env: docker
    image: n8nio/n8n:latest
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WEBHOOK_URL
        value: https://triage-n8n.onrender.com
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: triage-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: triage-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: triage-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: triage-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: triage-db
          property: password
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1

databases:
  - name: triage-db
    databaseName: triaje_db
    user: triaje_user
    plan: starter
